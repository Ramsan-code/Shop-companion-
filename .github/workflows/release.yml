# Signed App Bundle to the Play Store internal track (PRD 11.1, 12.2 R1).
# Run by hand from the Actions tab. Needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD   upload key (Play App Signing keeps the app key)
#   PROD_CONFIG_JSON       contents of config/prod.json (config/README.md)
#   FIREBASE_TOKEN_JSON    service account JSON with Firebase Crashlytics Admin
#   FIREBASE_ANDROID_APP_ID  1:…:android:… of the prod app
#   PLAY_SERVICE_ACCOUNT_JSON  service account with release rights in Play Console
name: Release (internal track)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (Tamil first)
        required: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Signing key and prod config
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PROD_CONFIG: ${{ secrets.PROD_CONFIG_JSON }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/upload.jks
          cat > android/key.properties <<PROPS
          storeFile=../upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "$PROD_CONFIG" > config/prod.json
      - run: flutter pub get
      - run: flutter test
      - run: >-
          flutter build appbundle --release --flavor prod
          --dart-define-from-file=config/prod.json
          --obfuscate --split-debug-info=build/symbols
      - name: Dart symbols to Crashlytics (readable stack traces)
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_TOKEN_JSON }}
          APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 crashlytics:symbols:upload --app="$APP_ID" build/symbols
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: lk.shopcompanion.shop_companion
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: completed
      - name: Clean up secrets
        if: always()
        run: rm -f android/upload.jks android/key.properties config/prod.json
