# Shop Companion checks. PRD 11.1: lints, dart format,
# unit/widget tests, Functions tests and Security Rules tests on the emulator.
name: Shop Companion

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date (drift)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  apk-size:
    # PRD 2 / 11: under 25 MB per ABI. Release APKs split per ABI, obfuscated,
    # signed with the debug key (size is the same).
    name: APK size (< 25 MB per ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build apk --release --flavor prod --split-per-abi
          --obfuscate --split-debug-info=build/symbols
      - name: Check sizes
        run: |
          limit=$((25 * 1024 * 1024))
          status=0
          for apk in build/app/outputs/flutter-apk/app-*-prod-release.apk; do
            size=$(stat -c %s "$apk")
            echo "$(basename "$apk"): $((size / 1024 / 1024)) MB"
            [ "$size" -le "$limit" ] || status=1
          done
          exit $status

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:emulator

  rules:
    name: Security Rules (emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
